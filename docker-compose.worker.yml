services:
  worker:
    build:
      context: .
      dockerfile: worker_node/Dockerfile
    container_name: proxy-worker
    restart: unless-stopped
    environment:
      MASTER_URL: localhost:62071
      NODE_TOKEN: murongpig
      WORKER_ID: worker
      WORKER_COUNT: 4
      INTERVAL: 2
      TIMEOUT: 8
      HEARTBEAT_INTERVAL: 15
      TARGET_URL: https://npmjs.org/cdn-cgi/trace
      LOG_DIR: /data/logs/worker
      LOG_LEVEL: INFO
      LOG_RETENTION_DAYS: 14
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
